#include <jni.h>
#include <dlfcn.h>
#include <android/log.h>

#define LOGI(...) __android_log_print(ANDROID_LOG_INFO, "AML12", __VA_ARGS__)

extern "C" void OnModLoad() {
    LOGI("Plugin AML berhasil dimuat!");

    void* handle = dlopen("libGTASA.so", RTLD_LAZY);
    if (!handle) {
        LOGI("Gagal membuka libGTASA.so");
        return;
    }

    // Mengambil fungsi internal game untuk meminta model mobil
    void (*CStreaming_RequestModel)(int, int) = 
        (void (*)(int, int))dlsym(handle, "_ZN10CStreaming12RequestModelEii");
    void (*CStreaming_LoadAllRequestedModels)(bool) = 
        (void (*)(bool))dlsym(handle, "_ZN10CStreaming22LoadAllRequestedModelsEb");

    if (CStreaming_RequestModel && CStreaming_LoadAllRequestedModels) {
        // ID 451 adalah Turismo
        CStreaming_RequestModel(451, 2);
        CStreaming_LoadAllRequestedModels(false);
        LOGI("Mobil Turismo (451) berhasil dipanggil ke memori!");
    }
}
